                    <span class="text-6xl">👑</span>
                    <span class="absolute top-3 right-3 bg-purple-600 text-white text-xs font-bold px-2 py-0.5 rounded">Exclusive</span>
                </div>
                <div class="p-5">
                    <h3 class="font-bold gaming-font text-xl mb-1">MP40 Predatory Cobra</h3>
                    <p class="text-gray-400 text-xs mb-4">Evo gun skin look replacement config pack featuring level 7 visual aesthetics.</p>
                    <button onclick="selectBundle('MP40 Predatory Cobra')" class="w-full bg-gray-800 hover:bg-red-600 text-gray-200 hover:text-white text-sm font-semibold py-2.5 rounded-lg transition">
