            <h2 class="text-3xl font-black gaming-font uppercase tracking-wide">Available Legendary Bundles</h2>
            <p class="text-gray-400 text-sm mt-1">Select a bundle package to generate your custom config file.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
