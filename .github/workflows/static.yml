    </footer>

    <!-- JavaScript for Interactivity -->
    <script>
        function selectBundle(bundleName) {
            document.getElementById('selectedBundleInput').value = bundleName;
            document.getElementById('generator').scrollIntoView({ behavior: 'smooth' });
        }

        function triggerDownload() {
            const bundle = document.getElementById('selectedBundleInput').value;
            const status = document.getElementById('statusMessage');
            
            if (bundle.includes("No bundle")) {
                status.className = "text-center text-xs text-red-400 font-semibold h-6";
                status.innerText = "⚠️ Please select a bundle package first!";
                return;
            }

            status.className = "text-center text-xs text-yellow-400 font-semibold h-6";
            status.innerText = "⏳ Generating config package for " + bundle + "...";

            setTimeout(() => {
                status.className = "text-center text-xs text-green-400 font-semibold h-6";
                status.innerText = "✅ Config generated successfully! Download started.";
                // Placeholder dummy download trigger simulation
                const blob = new Blob([`Config data for: ${bundle}\nStatus: Active\nTarget: com.dts.freefireth`], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = window.URL.createObjectURL(blob);
                link.download = `${bundle.toLowerCase().replace(/\s+/g, '_')}_config.zip`;
                link.click();
            }, 1500);
        }
    </script>
</body>
