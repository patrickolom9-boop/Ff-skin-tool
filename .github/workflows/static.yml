                <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl">
                    <span class="text-red-500 font-black gaming-font text-xl">02</span>
                    <h4 class="font-bold text-base mt-2 mb-1">Extract Files</h4>
                    <p class="text-gray-400 text-xs">Use an archive manager (like ZArchiver) to extract the downloaded bundle files.</p>
